name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # needed to create/update GitHub Releases

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # Fail fast on tag/DESCRIPTION mismatch so we don't ship a release
      # whose tag says one version and whose artifact filenames say another.
      - name: Verify tag matches DESCRIPTION version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          DESC_VERSION=$(grep '^Version:' DESCRIPTION | sed 's/^Version: *//' | tr -d '[:space:]')
          if [ "$TAG_VERSION" != "$DESC_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match DESCRIPTION Version: $DESC_VERSION"
            echo "Bump DESCRIPTION (or re-tag) so the two agree before pushing the tag."
            exit 1
          fi
          echo "OK: tag v$TAG_VERSION matches DESCRIPTION Version: $DESC_VERSION"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Download HEC-DSS native library
        run: Rscript tools/download_hecdss.R
        shell: bash

      # Linux runner produces the universal source tarball (`*.tar.gz`).
      # Anyone on any platform can install it with
      # `install.packages("hecdssr_<v>.tar.gz", repos = NULL, type = "source")`
      # provided they have a C/C++ toolchain.
      - name: Build source tarball
        if: runner.os == 'Linux'
        run: R CMD build --no-build-vignettes --no-manual .

      # Windows runner produces a binary `.zip` so end users without Rtools
      # can install with `install.packages("hecdssr_<v>.zip", repos = NULL)`.
      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          R CMD build --no-build-vignettes --no-manual .
          R CMD INSTALL --build hecdssr_*.tar.gz
          rm -f hecdssr_*.tar.gz   # keep only the .zip from this runner

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hecdssr-${{ runner.os }}
          path: |
            hecdssr_*.tar.gz
            hecdssr_*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Update rolling "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace the rolling pre-release in place so the download URL
          # https://github.com/<org>/<repo>/releases/download/latest/<file>
          # is stable, but always serves the most recent main build.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/* \
            --title "Latest main build" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "Automatically built from \`main\` at \`${GITHUB_SHA::7}\`. Not a stable release — for tagged releases see the [releases page](../../releases)."
